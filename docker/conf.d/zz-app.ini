; Overrides to match production php.ini directive values (phpinfo.md capture).
; Base preset is php.ini-production (see Dockerfile comment / D-05) — most of these
; already match the stock preset; they are still listed explicitly per D-04 so every
; DOCKER-03 directive is reviewable/diffable in one place.

; --- DOCKER-03 directives ---
memory_limit = 128M
upload_max_filesize = 2M
post_max_size = 8M
max_execution_time = 30
max_input_time = 60
max_input_vars = 1000
max_file_uploads = 20
date.timezone = Europe/Helsinki
error_reporting = 22527

; opcache.* tuning (matches PHP 8.2's own stock defaults, captured verbatim from phpinfo.md)
opcache.enable = On
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = On
opcache.save_comments = On

; session.* settings (matches phpinfo.md; also PHP's own stock defaults)
session.save_handler = files
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 1000
session.cookie_httponly = Off
session.cookie_secure = Off
session.use_strict_mode = Off
session.name = PHPSESSID

; --- D-01 deliberate LOCAL-ONLY exception: production has display_errors=Off ---
; Kept On here so failures are visible in-browser during local development.
; error_reporting above still matches prod exactly (D-02); log_errors stays On (D-03).
display_errors = On
display_startup_errors = On
log_errors = On
